<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canvas Redesign – BSCCS Group 01</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --bg: #2b2f36; --bar: #1f2228; --text: #e9ebef; --muted: #a3a9b4; --red: #e0332b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bar); display: flex; align-items: center; gap: 1rem;
           padding: calc(env(safe-area-inset-top, 0px) + .6rem) 1rem .6rem; }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid #454b56; border-radius: 6px; padding: .35rem .8rem; cursor: pointer; }
  button:hover { border-color: var(--red); }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* Scroll view: every slide stacked */
  .deck { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: grid; gap: 1.5rem; }
  .slide { margin: 0; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .slide img { display: block; width: 100%; height: auto; }

  /* Present view: one slide at a time */
  body.present header { display: none; }
  body.present .deck { max-width: none; height: 100vh; padding: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  body.present .slide { display: none; box-shadow: none; }
  body.present .slide.current { display: block; width: min(100vw, 177.78vh); }
  .hint { display: none; position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7);
           padding: .4rem .8rem; border-radius: 6px; font-size: .85rem; color: var(--muted); }
  body.present .hint { display: block; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 1rem calc(env(safe-area-inset-bottom, 0px) + 2rem); }
  body.present footer { display: none; }
</style>
</head>
<body>
  <header>
    <h1>Canvas Redesign – BSCCS Group 01</h1>
    <span class="spacer"></span>
    <button id="present" type="button">Present</button>
  </header>
  <main class="deck" id="deck">
    <figure class="slide" id="slide-1">
      <img src="slides/slide-01.jpg" alt="Slide 1: BSCCS Group 01 – Canvas redesign" width="2001" height="1125">
    </figure>
    <figure class="slide" id="slide-2">
      <img src="slides/slide-02.jpg" alt="Slide 2: Introduction: The Team & App Choice" width="2001" height="1125">
    </figure>
    <figure class="slide" id="slide-3">
      <img src="slides/slide-03.jpg" alt="Slide 3: Data Collection & Synthesis" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-4">
      <img src="slides/slide-04.jpg" alt="Slide 4: Primary Persona" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-5">
      <img src="slides/slide-05.jpg" alt="Slide 5: From Insights to Design Requirements" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-6">
      <img src="slides/slide-06.jpg" alt="Slide 6: Prioritisation Framework (MoSCoW)" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-7">
      <img src="slides/slide-07.jpg" alt="Slide 7: Proposed Design: Navigation & Dashboard" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-8">
      <img src="slides/slide-08.jpg" alt="Slide 8: Proposed Design: To-Do & Grades Tab" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-9">
      <img src="slides/slide-09.jpg" alt="Slide 9: Proposed Design: Accessibility & UX Improvements" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-10">
      <img src="slides/slide-10.jpg" alt="Slide 10: How the Design Meets the Needs of the Persona" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-11">
      <img src="slides/slide-11.jpg" alt="Slide 11: Role Contributions & Conflict Resolutions" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-12">
      <img src="slides/slide-12.jpg" alt="Slide 12: Most Important Lessons" width="2001" height="1125" loading="lazy">
    </figure>
    <figure class="slide" id="slide-13">
      <img src="slides/slide-13.jpg" alt="Slide 13: Q&A: Any Questions?" width="2001" height="1125" loading="lazy">
    </figure>
  </main>
  <div class="hint" id="hint">← → to change slides · Esc to exit</div>
  <footer>University College Cork · Student project, not affiliated with Instructure or Canvas</footer>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  let i = 0;
  const show = n => {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('current', k === i));
    document.getElementById('hint').textContent = `${i + 1} / ${slides.length} · ← → to change slides · Esc to exit`;
  };
  const start = () => {
    // start from whichever slide is currently in view
    const mid = window.innerHeight / 2;
    const inView = slides.findIndex(s => { const r = s.getBoundingClientRect(); return r.top <= mid && r.bottom >= mid; });
    document.body.classList.add('present'); show(inView < 0 ? 0 : inView);
    document.documentElement.requestFullscreen?.().catch(() => {});
  };
  const stop = () => {
    document.body.classList.remove('present');
    if (document.fullscreenElement) document.exitFullscreen();
    slides[i].scrollIntoView();
  };
  document.getElementById('present').addEventListener('click', start);
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('present')) stop(); });
  document.addEventListener('keydown', e => {
    if (!document.body.classList.contains('present')) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Escape') stop();
  });
  document.getElementById('deck').addEventListener('click', e => {
    if (!document.body.classList.contains('present')) return;
    e.clientX > window.innerWidth / 2 ? show(i + 1) : show(i - 1);
  });
</script>
</body>
</html>
